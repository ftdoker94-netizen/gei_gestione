<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a8a90">
<link rel="manifest" href="manifest.webmanifest">
<title>GEI Rapportini</title>
<style>
:root{--bg:#eef3f4;--card:#fff;--ink:#14262b;--ink2:#5b6e74;--line:#d6e0e2;--acc:#0a8a90;--accink:#fff;--bad:#b42318;--ok:#157f4a}
@media(prefers-color-scheme:dark){:root{--bg:#0f1b1f;--card:#16262b;--ink:#e8f1f2;--ink2:#9db1b6;--line:#294046;--bad:#ff8a7a;--ok:#5fd39a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 40px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 12px}
header h1{font-size:20px;margin:0}header button{background:none;border:0;color:var(--ink2);font:inherit;padding:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:12px 0 5px}
input,select,textarea{width:100%;font:inherit;padding:13px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:var(--acc);color:var(--accink);font:600 17px system-ui,sans-serif;cursor:pointer;margin-top:16px}
.btn.sec{background:none;color:var(--acc);border:1px solid var(--line);margin-top:8px;padding:11px;font-size:15px}
.btn:disabled{opacity:.55}
.op{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.op:first-of-type{border-top:0}
.op label{margin:0;flex:1;display:flex;align-items:center;gap:12px;font-size:17px;font-weight:500;color:var(--ink)}
.op input[type=checkbox]{width:26px;height:26px;flex:none}
.op input[type=number]{width:84px;text-align:right}
.day{font-weight:700;margin:16px 2px 6px}.day small{font-weight:500;color:var(--ink2)}
.r{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.r small{display:block;color:var(--ink2)}.r button{background:none;border:1px solid var(--line);color:var(--acc);border-radius:10px;padding:8px 12px;font:inherit}
#msg{min-height:22px;font-size:14px;margin-top:10px;text-align:center}.bad{color:var(--bad)}.ok{color:var(--ok)}
#login{min-height:80vh;display:grid;place-items:center}
.top{display:flex;gap:8px}.top>*{flex:1}
</style>
</head>
<body>
<div class="wrap">
<div id="login" hidden><div class="card" style="width:100%">
  <h1 style="margin:0 0 4px">GEI · Rapportini</h1><p style="margin:0 0 6px;color:var(--ink2)">Accedi con le credenziali ricevute.</p>
  <form id="lf"><label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
  <button class="btn" type="submit">Entra</button></form><div id="lmsg" class="bad" style="margin-top:10px"></div></div></div>

<div id="app" hidden>
  <header><h1>Rapportini</h1><button id="out">Esci</button></header>
  <form id="f" class="card">
    <div id="edit" hidden style="background:var(--bg);border-radius:10px;padding:8px 12px;margin-bottom:6px"><b>Modifica rapportino</b> <button type="button" id="canc" style="float:right;background:none;border:0;color:var(--acc);font:inherit">Annulla</button></div>
    <div class="top"><div><label for="d">Data</label><input id="d" type="date" required></div><div><label for="h">Ore per tutti</label><input id="h" type="number" inputmode="decimal" step="0.5" min="0.5" max="24" value="8"></div></div>
    <label for="c">Cantiere</label><select id="c" required></select>
    <label>Chi ha lavorato</label><div id="ops"></div>
    <label for="n">Lavori svolti (facoltativo)</label><textarea id="n" placeholder="es. Posa massetto camera e bagno"></textarea>
    <button class="btn" id="sv" type="submit">Salva rapportino</button>
    <div id="msg" role="status"></div>
  </form>
  <div id="list"></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s),cfg=window.GEI_CONFIG;
const sb=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true}});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dt=s=>{const [y,m,d]=s.split('-');return d+'/'+m+'/'+y};
const lsg=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lss=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let D={cantieri:[],operai:[],ore:[]},editId=null;
const say=(t,k)=>{const m=$('#msg');m.textContent=t||'';m.className=k||''};
async function load(){
  const {data,error}=await sb.rpc('capo_dati');
  if(error){ if(/non autorizzato/i.test(error.message)){await sb.auth.signOut();showLogin('Accesso non attivo per questo utente.');return false} say('Connessione assente: riprova tra poco.','bad');return false}
  D=data;draw();return true;
}
function draw(){
  const cs=$('#c'),sel=cs.value||lsg('cant')||'';
  cs.innerHTML=D.cantieri.map(c=>`<option value="${esc(c.id)}">${esc(c.nome)}</option>`).join('');
  if(D.cantieri.some(c=>c.id===sel))cs.value=sel;
  if(!$('#ops').children.length||!editId)drawOps({});
  const cn=id=>(D.cantieri.find(c=>c.id===id)||{}).nome||'—';
  const by={};D.ore.forEach(o=>(by[o.data]=by[o.data]||[]).push(o));
  $('#list').innerHTML=Object.keys(by).sort().reverse().map(d=>{
    const tot=by[d].reduce((a,o)=>a+Number(o.ore||0),0);
    return `<div class="day">${dt(d)} <small>· ${by[d].length} ${by[d].length===1?'operaio':'operai'} · ${tot} h</small></div><div class="card" style="padding:4px 16px">${by[d].map(o=>`<div class="r"><div><b>${esc(o.operaio)}</b> · ${Number(o.ore)} h<small>${esc(cn(o.cantiereId))}${o.descrizione?' · '+esc(o.descrizione):''}</small></div>${o.mio?`<button data-e="${esc(o.id)}">Modifica</button>`:''}</div>`).join('')}</div>`}).join('')||'<p style="text-align:center;color:var(--ink2)">Nessun rapportino negli ultimi 30 giorni.</p>';
}
function drawOps(sel){
  $('#ops').innerHTML=D.operai.map(p=>{const s=sel[p.id];return `<div class="op"><label><input type="checkbox" data-id="${esc(p.id)}"${s!=null?' checked':''}><span>${esc(p.nome)}</span></label><input type="number" inputmode="decimal" step="0.5" min="0" max="24" data-h="${esc(p.id)}" placeholder="ore" value="${s!=null?s:''}"></div>`}).join('')||'<p style="color:var(--ink2)">Nessun operaio in anagrafica.</p>';
}
$('#ops').addEventListener('change',e=>{
  const t=e.target;if(t.dataset.id){const h=$('#ops [data-h="'+t.dataset.id+'"]');if(t.checked&&!h.value)h.value=$('#h').value;if(!t.checked)h.value=''}
});
function resetForm(){const dd=$('#del');if(dd)dd.remove();editId=null;$('#edit').hidden=true;$('#n').value='';$('#sv').textContent='Salva rapportino';drawOps({})}
$('#canc').onclick=resetForm;
$('#list').addEventListener('click',e=>{
  const id=e.target.dataset&&e.target.dataset.e;if(!id)return;const o=D.ore.find(x=>x.id===id);if(!o)return;
  editId=id;$('#edit').hidden=false;$('#d').value=o.data;$('#c').value=o.cantiereId;$('#n').value=o.descrizione||'';$('#sv').textContent='Salva modifica';
  drawOps({[o.operaioId]:Number(o.ore)});  $('#ops').querySelectorAll('[data-id]').forEach(c=>{if(c.dataset.id!==o.operaioId){c.disabled=true;$('#ops [data-h="'+c.dataset.id+'"]').disabled=true}});
  const del=document.createElement('button');del.type='button';del.className='btn sec';del.id='del';del.textContent='Elimina questo rapportino';$('#f').appendChild(del);
  scrollTo({top:0,behavior:'smooth'});
});
$('#f').addEventListener('click',async e=>{
  if(e.target.id!=='del')return;
  if(!confirm('Eliminare questo rapportino?'))return;
  const {error}=await sb.rpc('capo_elimina_ora',{p_id:editId});
  if(error){say('Non riuscito: '+error.message,'bad');return}
  e.target.remove();resetForm();say('Rapportino eliminato.','ok');load();
});
$('#f').addEventListener('submit',async e=>{
  e.preventDefault();say('');
  const rows=[...$('#ops').querySelectorAll('[data-id]:checked')].map(c=>({op:c.dataset.id,h:parseFloat(String($('#ops [data-h="'+c.dataset.id+'"]').value).replace(',','.'))}));
  if(!rows.length){say('Scegli almeno un operaio.','bad');return}
  if(rows.some(r=>!(r.h>0&&r.h<=24))){say('Controlla le ore (da 0,5 a 24).','bad');return}
  const b=$('#sv');b.disabled=true;let ok=0;
  for(const r of rows){
    const {error}=await sb.rpc('capo_salva_ora',{p_id:editId||'',p_cantiere:$('#c').value,p_operaio:r.op,p_data:$('#d').value,p_ore:r.h,p_desc:$('#n').value.trim()});
    if(error){say('Non riuscito: '+error.message,'bad');b.disabled=false;return}ok++;
  }
  b.disabled=false;lss('cant',$('#c').value);
  const d=$('#del');if(d)d.remove();resetForm();say(ok===1?'Rapportino salvato.':ok+' rapportini salvati.','ok');await load();
});
function showLogin(m){$('#app').hidden=true;$('#login').hidden=false;$('#lmsg').textContent=m||''}
async function start(){$('#login').hidden=true;$('#app').hidden=false;$('#d').value=iso(new Date());await load()}
$('#lf').addEventListener('submit',async e=>{
  e.preventDefault();$('#lmsg').textContent='Accesso…';
  const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error){$('#lmsg').textContent='Email o password non corrette.';return}
  $('#lmsg').textContent='';start();
});
$('#out').onclick=async()=>{await sb.auth.signOut();location.reload()};
sb.auth.getSession().then(({data})=>data&&data.session?start():showLogin());
sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')showLogin()});
})();
</script>
</body>
</html>
