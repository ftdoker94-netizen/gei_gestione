<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a8a90">
<title>Controllo Gestione GEI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
#login[hidden]{display:none}
#login{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,var(--band-a),var(--band-b))}
#login .card{background:var(--surface);color:var(--ink);border-radius:18px;padding:28px;width:min(380px,100%);box-shadow:0 10px 40px rgba(0,0,0,.18)}
#login h1{font:700 26px 'Barlow Condensed',sans-serif;margin:0 0 4px}
#login p{color:var(--ink-2);margin:0 0 18px;font-size:14px}
#login label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
#login input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--surface-2);color:var(--ink)}
#login button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:600 16px Barlow,sans-serif;cursor:pointer}
#login #login-msg{min-height:20px;margin-top:10px;font-size:13px;color:var(--bad-ink)}
</style>
</head>
<body>
<div id="login" hidden>
  <div class="card">
    <h1>Controllo di gestione</h1>
    <p>Gruppo Edile Immobiliare · accedi per continuare</p>
    <form id="login-form">
      <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Entra</button>
    </form>
    <div id="login-msg" role="status"></div>
  </div>
</div>
<div id="appwrap" hidden>
<div class="app">
  <header class="band">
    <div class="brand"><span class="mark">GEI</span><span class="brand-t">Controllo di gestione<small>Gruppo Edile Immobiliare</small></span></div>
    <div class="band-r"><span class="sync" id="sync">Connessione…</span><button class="avatar" id="logout" title="Esci" aria-label="Esci" style="border:0;color:#fff;cursor:pointer" onclick="geiLogout()">F</button></div>
  </header>
  <div class="shell">
    <nav class="rail" id="rail" aria-label="Sezioni"></nav>
    <main id="main"><div class="empty"><h3>Carico i dati</h3><span>Un attimo.</span></div></main>
  </div>
</div>
<div class="ov" id="ov" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="db.js"></script>
<script src="main.js"></script>
</body>
</html>
